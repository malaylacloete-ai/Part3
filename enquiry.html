<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--SEO: Page title-->
    <title>Enquiry Form | MTC Holdings</title>

    <!--SEO: Meta description-->
    <meta name="description"
          content="Submit your enquiries online and get quick assistance with products, services, orders and customer support.">

    <!--SEO: Meta keywords-->
    <meta name="keywords"
        content="enquiry,contact us, enquiries: product or services, customer assistance, feedback, online equiry form">

    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/responsive.css">
</head>
<body>

    <section class="content">
    <header>
        <h1>Enquiry</h1>
    </header>
    </section>

    <!--Navigation:The menu required for the common page structure-->
    <nav>
        <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About us</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="enquiry.html">Enquiry</a></li>
        <li><a href="contact.html">Contact us</a></li>
        </ul>
    </nav>
    
    <!--Enquiry Form-->
    <section class="container">
        <form id="enquiryForm">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" required>
            <p class="error" id="nameError"></p>
             
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" autocomplete="email" required>
            <p class="error" id="emailError"></p>

            <!--Product / Services-->
            <label for="type">Enquiry Type</label>
            <select id="type">
                <opition value=""></opition> <!--Select-->
                <opition value="Clothing">Clothing</opition>
                <opition value="Home essentials">Home essentials</opition>
                <opition value="Delivery Service">Delivery Service</opition>
                <opition value="repair">Repair Services</opition>
            </select>
            <p class="error" id="typeError"></p>

            <!--Message-->
        <label for="message">Message</label>
        <textarea id="message" rows="4"></textarea>
        <p class="error" id="messageError"></p>

         <input type="submit" value="Submit Enquiry">

        </form>

        <!--Response-->
        <section id="responseBox"></section>

    </section>
    
    <footer>
        <p>&copy;2026 MTC Holdings.All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
